    <path id="regmark-tr" d="M 170.0,10.0 L 190.0,10.0 L 190.0,30.0" style="fill:none;stroke:#000000;stroke-width:0.5;stroke-linecap:butt;stroke-linejoin:miter"/>
    <path id="regmark-bl" d="M 30.0,287.0 L 10.0,287.0 L 10.0,267.0" style="fill:none;stroke:#000000;stroke-width:0.5;stroke-linecap:butt;stroke-linejoin:miter"/>
